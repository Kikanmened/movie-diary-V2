<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Diary</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <nav class="bg-gray-800 shadow-md p-4 flex flex-col sm:flex-row justify-between items-center gap-2">
    <h1 class="text-xl font-bold">🎬 Movie Diary</h1>
    <div class="flex gap-4 items-center">
        <a href="index.html" class="text-blue-400 font-semibold">Home</a>
        <a href="pages/journal.html" class="hover:text-blue-400 transition-colors">Journal</a>
        <div id="authLinks" class="flex gap-4"></div>
    </div>
</nav>
<header class="p-4 text-center sm:text-left">
    <h2 class="text-2xl font-bold">Discover Popular Movies</h2>
    <p class="text-gray-400">Search and save your favorite movies.</p>
</header>
<section id="search" class="p-4 flex flex-col sm:flex-row gap-2">
    <input id="searchInput" type="text" placeholder="Search movies..." class="bg-white text-black px-3 py-2 rounded w-full sm:w-auto sm:flex-1">
    <button id="searchButton" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">Search</button>
</section>
    <section id="featured">
        <h2>Featured Movies</h2>
    </section>
    <dialog id="searchDialog" class="bg-gray-900 text-white rounded-lg p-4 w-full max-w-lg backdrop:bg-black/60">
    <div class="flex justify-between items-center mb-3">
        <h3 class="text-lg font-semibold">Search Results</h3>
        <button id="closeDialog" class="text-gray-400 hover:text-white">✕ Close</button>
    </div>

    <div id="searchResults" class="max-h-96 overflow-y-auto">
        <!-- Search results will appear here -->
    </div>
    </dialog>
     <section id="movies" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6 p-6">
     </section>
    <footer>
        <p>© 2026 Movie Diary</p>
    </footer>
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="auth.js"></script>
    <script src="main.js"></script>
</body>
</html>
