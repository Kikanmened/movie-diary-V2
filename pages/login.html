<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Diary - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <nav class="bg-gray-800 shadow-md p-4 flex flex-col sm:flex-row justify-between items-center gap-2">
        <a href="../index.html" class="text-xl font-bold">🎬 Movie Diary</a>
        <div id="authLinks" class="flex gap-4"></div>
    </nav>

    <main class="flex justify-center items-center min-h-[80vh] p-4">
        <form id="login-form" class="space-y-4 bg-gray-800 p-6 rounded-lg w-full max-w-sm">
            <h1 class="text-2xl font-bold">Login</h1>

            <p id="login-error" class="hidden text-red-400 text-sm"></p>
            <p id="login-success" class="hidden text-green-400 text-sm"></p>

            <label class="block">Email
                <input id="login-email" type="email" placeholder="Enter email"
                    class="w-full bg-white text-black px-3 py-2 rounded mt-1" required>
            </label>

            <label class="block">Password
                <input id="login-password" type="password" placeholder="Enter password"
                    class="w-full bg-white text-black px-3 py-2 rounded mt-1" required>
            </label>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-semibold">
                Login
            </button>

            <p class="text-sm text-gray-400">
                Don't have an account?
                <a href="signup.html" class="text-blue-400 hover:underline">Sign Up</a>
            </p>
        </form>
    </main>

    <script src="../auth.js"></script>
    <script>
        const loginForm = document.querySelector("#login-form");
        const loginError = document.querySelector("#login-error");
        const loginSuccess = document.querySelector("#login-success");
        const loginSubmitBtn = loginForm.querySelector("button[type='submit']");

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            loginError.classList.add("hidden");

            const email = document.querySelector("#login-email").value.trim();
            const password = document.querySelector("#login-password").value;

            try {
                await loginUser(email, password);

                loginSuccess.textContent = "Login successful! Redirecting...";
                loginSuccess.classList.remove("hidden");
                loginSubmitBtn.disabled = true;

                setTimeout(() => {
                    window.location.href = "../index.html";
                }, 800);
            } catch (error) {
                loginSuccess.classList.add("hidden");
                loginError.textContent = error.message;
                loginError.classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
