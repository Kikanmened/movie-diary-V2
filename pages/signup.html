<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Diary - Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <nav class="bg-gray-800 shadow-md p-4 flex flex-col sm:flex-row justify-between items-center gap-2">
        <a href="../index.html" class="text-xl font-bold">🎬 Movie Diary</a>
        <div id="authLinks" class="flex gap-4"></div>
    </nav>

    <main class="flex justify-center items-center min-h-[80vh] p-4">
        <form id="signup-form" class="space-y-4 bg-gray-800 p-6 rounded-lg w-full max-w-sm">
            <h1 class="text-2xl font-bold">Create Account</h1>

            <p id="signup-error" class="hidden text-red-400 text-sm"></p>
            <p id="signup-success" class="hidden text-green-400 text-sm"></p>

            <label class="block">Username
                <input id="signup-username" type="text" placeholder="Enter username"
                    class="w-full bg-white text-black px-3 py-2 rounded mt-1" required>
            </label>

            <label class="block">Email
                <input id="signup-email" type="email" placeholder="Enter email"
                    class="w-full bg-white text-black px-3 py-2 rounded mt-1" required>
            </label>

            <label class="block">Password
                <input id="signup-password" type="password" placeholder="Enter password"
                    class="w-full bg-white text-black px-3 py-2 rounded mt-1" required>
            </label>

            <label class="block">Confirm Password
                <input id="signup-confirm-password" type="password" placeholder="Confirm password"
                    class="w-full bg-white text-black px-3 py-2 rounded mt-1" required>
            </label>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded font-semibold">
                Sign Up
            </button>

            <p class="text-sm text-gray-400">
                Already have an account?
                <a href="login.html" class="text-blue-400 hover:underline">Login</a>
            </p>
        </form>
    </main>

    <script src="../auth.js"></script>
    <script>
        const signupForm = document.querySelector("#signup-form");
        const signupError = document.querySelector("#signup-error");
        const signupSuccess = document.querySelector("#signup-success");
        const signupSubmitBtn = signupForm.querySelector("button[type='submit']");

        function showSignupError(message) {
            signupSuccess.classList.add("hidden");
            signupError.textContent = message;
            signupError.classList.remove("hidden");
        }

        signupForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            signupError.classList.add("hidden");
            signupSuccess.classList.add("hidden");

            const username = document.querySelector("#signup-username").value.trim();
            const email = document.querySelector("#signup-email").value.trim();
            const password = document.querySelector("#signup-password").value;
            const confirmPassword = document.querySelector("#signup-confirm-password").value;

            if (!username || !email || !password || !confirmPassword) {
                showSignupError("Please fill in all fields.");
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showSignupError("Please enter a valid email address.");
                return;
            }

            if (password !== confirmPassword) {
                showSignupError("Passwords do not match.");
                return;
            }

            if (password.length < 6) {
                showSignupError("Password must be at least 6 characters.");
                return;
            }

            try {
                await registerUser(username, email, password);
                await loginUser(email, password);

                signupSuccess.textContent = "Account created successfully! Redirecting...";
                signupSuccess.classList.remove("hidden");
                signupSubmitBtn.disabled = true;

                setTimeout(() => {
                    window.location.href = "../index.html";
                }, 800);
            } catch (error) {
                showSignupError(error.message);
            }
        });
    </script>
</body>
</html>
